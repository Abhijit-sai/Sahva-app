name: Android test APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sahva_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    timeout-minutes: 25
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://sahva.madsoul.in' }}
      VITE_PUBLIC_WEB_URL: ${{ vars.VITE_PUBLIC_WEB_URL || 'https://sahva.madsoul.in' }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      SAHVA_WEB_HOST: ${{ vars.SAHVA_WEB_HOST || 'sahva.madsoul.in' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx --test scripts/auth-configuration.test.mjs
      - run: npm run build
      - run: npx drizzle-kit generate && git diff --exit-code -- drizzle && test -z "$(git ls-files --others --exclude-standard drizzle)"
      - name: Test PostgreSQL migrations and signaling
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/sahva_test
          SAHVA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/sahva_test
        run: node dist-server/migrate.js && node --test scripts/signaling.integration.mjs
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: sahva-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

