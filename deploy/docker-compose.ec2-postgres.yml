services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sahva
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set the database administrator password}
      SAHVA_DB_PASSWORD: ${SAHVA_DB_PASSWORD:?Set the Sahva database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-sahva.sql:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sahva"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    environment:
      DATABASE_URL: postgresql://sahva:${SAHVA_DB_PASSWORD}@postgres:5432/sahva
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
  app:
    environment:
      DATABASE_URL: postgresql://sahva:${SAHVA_DB_PASSWORD}@postgres:5432/sahva
    networks: [default, database]
networks:
  database:
    internal: true
volumes:
  postgres-data:
    external: true
    name: ${SAHVA_PG_VOLUME:-sahva-postgres16}
