map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/sahva/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sahva/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    location = /downloads/sahva-test.apk {
        alias /srv/sahva-downloads/sahva-test.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="sahva-test.apk"';
    }
    location ^~ /ws/ {
        access_log off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://app:3000;
    }
    location / {
        proxy_read_timeout 300s;
        proxy_pass http://app:3000;
    }
}

